services:
  app:
    image: docker-proxy.artifactory.tcsbank.ru/library/golang:1.26
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "127.0.0.1:8080:8080"
    command: ["sleep", "infinity"]

volumes:
  go-mod-cache:
  go-build-cache:
